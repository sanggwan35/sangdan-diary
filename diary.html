        function renderWeekSelector() {

            const oldSelector =
                document.querySelector(".week-selector");

            const selector =
                document.createElement("div");

            selector.className =
                "week-selector";

                document.createElement("button");

            prev.className =
                "week-arrow";

            prev.textContent = "‹";

                "click",
                () => {
                    selectedDate = addDays(
                        selectedDate,
                        -7

                    showDiaries(
                        getFilteredDiaries(),

                () => {

                        selectedDate,
                        7

                    showDiaries(
                        getFilteredDiaries(),
                        currentFilter
                    );
                }
            );

            for (let i = 0; i < 7; i++) {

                const date =
                    addDays(
                        selectedDate,
                        i - 3
                    );

                const button =
                    document.createElement("button");

                button.className =
                    "week-date";

                if (
                    date === selectedDate

                    button.classList.add(
                        "selected"

                    document.createElement("span");

                    document.createElement("span");

                    "day-number";

                dayNumber.textContent =
                    formatMonthDay(date);

                button.appendChild(dayName);
                button.appendChild(dayNumber);

                button.addEventListener(
                    "click",
                    () => {
                        selectedDate = date;

                        showDiaries(
                            getFilteredDiaries(),
                            currentFilter
                        );
                    }
                );

                dates.appendChild(button);
            }

            selector.appendChild(prev);
            selector.appendChild(dates);
            selector.appendChild(next);

            diaryList.appendChild(selector);
        }

        function addDays(date, amount) {

                    date.getDate()
                ).padStart(2, "0");

            return `${year}-${month}-${day}`;

            ];

            return names[

            ];
        }

        async function loadComments(
    diaryId,
    commentList,
    commentTitle
) {
    commentList.innerHTML = "";

    try {
        const commentsRef = collection(
            db,
            "diaries",
            diaryId,
            "comments"
        );

        const snapshot = await getDocs(commentsRef);

        const comments = [];

        snapshot.forEach((commentDoc) => {
            comments.push({
                id: commentDoc.id,
                ...commentDoc.data()
            });
        });

        comments.sort((a, b) => {
            const getTime = (value) => {
                if (!value) return 0;

                if (
                    value &&
                    typeof value.toDate === "function"
                ) {
                    return value.toDate().getTime();
                }

                if (value instanceof Date) {
                    return value.getTime();
                }

                return 0;
            };

            return getTime(a.createdAt) - getTime(b.createdAt);
        });

        commentTitle.textContent =
            `💬 댓글 ${comments.length}개`;

        if (comments.length === 0) {
            const empty = document.createElement("p");

            empty.textContent = "아직 댓글이 없어요.";
            empty.style.fontSize = "13px";

            commentList.appendChild(empty);

            return;
        }

        comments.forEach((comment) => {
            createComment(
                diaryId,
                comment.id,
                comment,
                commentList
            );
        });

    } catch (error) {

        console.error(
            "댓글 불러오기 오류:",
            error
        );

        commentTitle.textContent = "💬 댓글";

        commentList.innerHTML = "";

        const errorMessage =
            document.createElement("p");

        errorMessage.textContent =
            "댓글을 불러오지 못했어요.";

        errorMessage.style.color = "#a00";

        commentList.appendChild(
            errorMessage
        );
    }
}

        function formatCommentDate(date) {
    if (!date) return "";

    let d;

    if (date.toDate) {
        d = date.toDate();
    } else if (date instanceof Date) {
        d = date;
    } else {
        d = new Date(date);
    }

    if (isNaN(d.getTime())) {
        return "";
    }

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const hour = String(d.getHours()).padStart(2, "0");
    const minute = String(d.getMinutes()).padStart(2, "0");

    return `${year}.${month}.${day} ${hour}:${minute}`;
}

                        const commentTitle =
                            parent.querySelector(
                                "p"
                            );


                        await loadComments(

                            diaryId,

                            commentList,

                            commentTitle

                        );


                    } catch (error) {

                        console.error(error);

                        alert(
                            "댓글을 수정하는 중 문제가 생겼어요."
                        );

                    }

                }
            );


            cancelButton.addEventListener(
                "click",
                async () => {

                    const parent =
                        commentList.parentElement;


                    const commentTitle =
                        parent.querySelector(
                            "p"
                        );


                    await loadComments(

                        diaryId,

                        commentList,

                        commentTitle

                    );

                }
            );

        }


        // =========================
        // 일기 수정
        // =========================

        function editDiary(
            diary,
            post
        ) {

            post.innerHTML = "";


            const date =
                document.createElement("p");


            date.className =
                "date";


            date.textContent =
                diary.date;


            const titleInput =
                document.createElement("input");


            titleInput.type =
                "text";


            titleInput.value =
                diary.title;


            titleInput.style.width =
                "100%";


            titleInput.style.boxSizing =
                "border-box";


            titleInput.style.padding =
                "10px";


            titleInput.style.marginBottom =
                "15px";


            titleInput.style.fontFamily =
                "monospace";


            titleInput.style.fontSize =
                "18px";


            const contentInput =
                document.createElement("textarea");


            contentInput.value =
                diary.content;


            contentInput.style.width =
                "100%";


            contentInput.style.boxSizing =
                "border-box";


            contentInput.style.height =
                "250px";


            contentInput.style.padding =
                "10px";


            contentInput.style.fontFamily =
                "monospace";


            contentInput.style.fontSize =
                "14px";


            contentInput.style.resize =
                "vertical";


            const saveButton =
                document.createElement("button");


            saveButton.textContent =
                "저장";


            saveButton.className =
                "save-button";


            saveButton.style.display =
                "inline-block";


            saveButton.style.margin =
                "15px 5px 0 0";


            const cancelButton =
                document.createElement("button");


            cancelButton.textContent =
                "취소";


            cancelButton.className =
                "save-button";


            cancelButton.style.display =
                "inline-block";


            cancelButton.style.margin =
                "15px 0 0 0";


            post.appendChild(
                date
            );


            post.appendChild(
                titleInput
            );


            post.appendChild(
                contentInput
            );


            post.appendChild(
                saveButton
            );


            post.appendChild(
                cancelButton
            );


            saveButton.addEventListener(
                "click",
                async () => {

                    const newTitle =
                        titleInput.value.trim();


                    const newContent =
                        contentInput.value.trim();


                    if (
                        !newTitle ||
                        !newContent
                    ) {

                        alert(
                            "제목과 내용을 모두 입력해주세요."
                        );

                        return;

                    }


                    try {

                        await updateDoc(

                            doc(
                                db,
                                "diaries",
                                diary.id
                            ),

                            {

                                title:
                                    newTitle,

                                content:
                                    newContent

                            }

                        );


                        await loadDiaries();


                    } catch (error) {

                        console.error(error);

                        alert(
                            "수정하는 중 문제가 생겼어요."
                        );

                    }

                }
            );


            cancelButton.addEventListener(
                "click",
                () => {

                    showDiaries(
                        getFilteredDiaries(),
                        currentFilter
                    );

                }
            );

        }


        // =========================
        // 일기 삭제
        // =========================

        
async function deleteDiary(
    diaryId
) {

    const answer =
        confirm(
            "이 일기를 휴지통으로 이동할까요?"
        );


    if (!answer) return;


    try {

        await updateDoc(

            doc(
                db,
                "diaries",
                diaryId
            ),

            {
                isTrashed: true
            }

        );


        alert(
            "일기가 휴지통으로 이동되었습니다."
        );


        await loadDiaries();


    } catch (error) {

        console.error(error);

        alert(
            "휴지통으로 이동하는 중 문제가 생겼어요."
        );

    }

}



        // 현재 탭에 맞는 일기만 가져오기
        function getFilteredDiaries() {

            if (currentFilter === "me") {

                return allDiaries.filter(
                    diary =>
                        diary.authorUid ===
                        currentUser.uid
                );

            }

            if (currentFilter === "friend") {

                return allDiaries.filter(
                    diary =>
                        diary.authorUid !==
                        currentUser.uid
                );

            }

            return allDiaries;

        }


        // =========================
        // ALL
        // =========================

        document
            .getElementById("all-button")
            .addEventListener(
                "click",
                () => {

                    currentFilter = "all";

                     document
                .getElementById("diary-list")
                .classList.remove("single-author-list");


                    showDiaries(
                        getFilteredDiaries(),
                        currentFilter
                    );

                }
            );


        // =========================
        // 나
        // =========================

        document
            .getElementById("me-button")
            .addEventListener(
                "click",
                () => {

                    currentFilter = "me";

                    document
                .getElementById("diary-list")
                .classList.add("single-author-list");

                    showDiaries(
                        getFilteredDiaries(),
                        currentFilter
                    );

                }
            );


        // =========================
        // 친구
        // =========================

        document
            .getElementById("friend-button")
            .addEventListener(
                "click",
                () => {

                    currentFilter = "friend";

                    document
                .getElementById("diary-list")
                .classList.add("single-author-list");


                    showDiaries(
                        getFilteredDiaries(),
                        currentFilter
                    );

                }
            );
    </script>
