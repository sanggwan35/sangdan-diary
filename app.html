<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SANGWAN-DANNA PRISON</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #site-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        #music-player {
    position: fixed;
    top: 12px;
    left: 70%;
    transform: translateX(-50%);
    z-index: 99999;

    display: flex;
    align-items: center;
    gap: 5px;

    padding: 2px 6px;

    font-family: monospace;

    background: transparent;

    filter: drop-shadow(3px 4px 1px rgba(98, 80, 68, 0.45));

    border: none;
    border-radius: 0;
    box-shadow: none;

    

}




#music-player::after {
    content: "";
    position: absolute;

    inset: 0;

    background: #F7F2DF;
    border: 1px solid #b9aa9a;

    clip-path: polygon(
        0% 5%,
        8% 2%,
        16% 4%,
        25% 1%,
        35% 3%,
        45% 1%,
        55% 4%,
        65% 2%,
        75% 3%,
        85% 1%,
        100% 4%,
        99% 96%,
        90% 98%,
        80% 96%,
        70% 99%,
        60% 97%,
        50% 99%,
        40% 96%,
        30% 98%,
        20% 96%,
        10% 99%,
        0% 96%
    );

    z-index: -2;

}





#music-player::before {
    content: "";

    position: absolute;

    width: 55px;
    height: 14px;

    top: -7px;
    left: 18px;

    background: rgba(214, 199, 177, 0.65);

    border: 1px solid rgba(180, 163, 140, 0.25);

    transform: rotate(-3deg);

    z-index: -1;
}


        #music-player button {
    width: 25px;
    height: 25px;

    padding: 0;

    border: 0;
    background: transparent;
    color: #625044;

    font-family: monospace;
    font-size: 12px;

    cursor: pointer;
}

#music-player button:hover {
    background: #f1ebe3;
    border-radius: 3px;
}

#music-title {
    width: 100px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    color: #625044;
    font-size: 11px;
    text-align: center;

    padding: 2px 7px;

    border-left: 1px dashed #c8b9aa;
    border-right: 1px dashed #c8b9aa;
}

#music-volume {
    width: 45px;
    margin: 0;
    cursor: pointer;
    accent-color: #8b7969;
}

#music-player::before {
    content: "";
    position: absolute;

    width: 55px;
    height: 14px;

    top: -7px;
    left: 18px;

    background: rgba(214, 199, 177, 0.75);

    transform: rotate(-3deg);

    border: 1px solid rgba(180, 163, 140, 0.25);

    z-index: -1;
}


    </style>
</head>

<body>

<div id="music-player">
    <button id="music-prev">⏮</button>
    <button id="music-play">▶</button>
    <button id="music-next">⏭</button>

    <span id="music-title">Like A Raspberry</span>

    <input
        id="music-volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
    >

    <audio id="music-audio"></audio>
</div>

<iframe
    id="site-frame"
    src="index.html">
</iframe>

<script>
const musicAudio =
    document.getElementById("music-audio");

const musicPlay =
    document.getElementById("music-play");

const musicPrev =
    document.getElementById("music-prev");

const musicNext =
    document.getElementById("music-next");

const musicTitle =
    document.getElementById("music-title");

const musicVolume =
    document.getElementById("music-volume");


const musicList = [
    {
        title: "Like A Raspberry",
        src: "music/Like A Raspberry.mp3"
    },
    {
        title: "Love song",
        src: "music/Love song.mp3"
    },
    {
        title: "Kataomoi",
        src: "music/Kataomoi.mp3"
    },
    {
        title: "Tsukue Sasuru",
        src: "music/Tsukue Sasuru.mp3"
    },
    {
        title: "毎朝",
        src: "music/毎朝.mp3"
    }
];


let currentMusicIndex = 0;

musicAudio.volume = 0.5;


function loadMusic(index) {

    currentMusicIndex = index;

    musicAudio.src =
        musicList[index].src;

    musicTitle.textContent =
        musicList[index].title;
}


loadMusic(0);


musicPlay.addEventListener("click", async () => {

    if (musicAudio.paused) {

        await musicAudio.play();

        musicPlay.textContent = "⏸";

    } else {

        musicAudio.pause();

        musicPlay.textContent = "▶";
    }
});


musicPrev.addEventListener("click", () => {

    currentMusicIndex =
        (currentMusicIndex - 1 + musicList.length)
        % musicList.length;

    loadMusic(currentMusicIndex);

    musicAudio.play();

    musicPlay.textContent = "⏸";
});


musicNext.addEventListener("click", () => {

    currentMusicIndex =
        (currentMusicIndex + 1)
        % musicList.length;

    loadMusic(currentMusicIndex);

    musicAudio.play();

    musicPlay.textContent = "⏸";
});


musicVolume.addEventListener("input", () => {

    musicAudio.volume =
        Number(musicVolume.value);

});


musicAudio.addEventListener("ended", () => {

    musicNext.click();

});

window.addEventListener("message", (event) => {

    if (event.data === "site-click") {

        if (musicAudio.paused) {

            musicAudio.play()
                .then(() => {
                    musicPlay.textContent = "⏸";
                })
                .catch(() => {});

        }

    }

});


</script>

</body>
</html>
