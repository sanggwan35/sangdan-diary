<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Music</title>
    <style>
        body {
            margin: 0;
            background: #fffaf3;
            color: #625044;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #music-player {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button {
            width: 30px;
            height: 30px;
            border: 1px solid #625044;
            background: transparent;
            color: #625044;
            border-radius: 5px;
            cursor: pointer;
        }

        #music-title {
            width: 120px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            text-align: center;
            font-size: 12px;
        }

        #music-volume {
            width: 50px;
        }
    </style>
</head>

<body>

<div id="music-player">
    <button id="music-prev">⏮</button>
    <button id="music-play">▶</button>
    <button id="music-next">⏭</button>

    <span id="music-title">노래 제목</span>

    <input
        id="music-volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
    >

    <audio id="music-audio"></audio>
</div>

<script>
const musicAudio = document.getElementById("music-audio");
const musicPlay = document.getElementById("music-play");
const musicPrev = document.getElementById("music-prev");
const musicNext = document.getElementById("music-next");
const musicTitle = document.getElementById("music-title");
const musicVolume = document.getElementById("music-volume");

const musicList = [
    {
        title: "Like A Raspberry",
        src: "music/Like A Raspberry.mp3"
    },
    {
        title: "Love song",
        src: "music/Love song.mp3"
    },
    {
        title: "Kataomoi",
        src: "music/Kataomoi.mp3"
    },
    {
        title: "Tsukue Sasuru",
        src: "music/Tsukue Sasuru.mp3"
    },
    {
        title: "毎朝",
        src: "music/毎朝.mp3"
    }
];

let currentMusicIndex = 0;

function loadMusic(index) {
    currentMusicIndex = index;
    musicAudio.src = musicList[index].src;
    musicTitle.textContent = musicList[index].title;
}

musicPlay.addEventListener("click", () => {
    if (musicAudio.paused) {
        musicAudio.play();
        musicPlay.textContent = "⏸";
    } else {
        musicAudio.pause();
        musicPlay.textContent = "▶";
    }
});

musicPrev.addEventListener("click", () => {
    currentMusicIndex =
        (currentMusicIndex - 1 + musicList.length) % musicList.length;

    loadMusic(currentMusicIndex);
    musicAudio.play();
    musicPlay.textContent = "⏸";
});

musicNext.addEventListener("click", () => {
    currentMusicIndex =
        (currentMusicIndex + 1) % musicList.length;

    loadMusic(currentMusicIndex);
    musicAudio.play();
    musicPlay.textContent = "⏸";
});

musicVolume.addEventListener("input", () => {
    musicAudio.volume = musicVolume.value;
});

musicAudio.addEventListener("ended", () => {
    musicNext.click();
});

musicAudio.volume = 0.5;

loadMusic(0);
</script>

</body>
</html>
