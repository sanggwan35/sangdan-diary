<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PAGE - 우리들의 교환일기</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ==================================================
           MY PAGE
        ================================================== */

        .mypage-container {
            width: 94%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .mypage-paper {
            position: relative;
            margin-top: 30px;
            padding: 45px 45px 40px 70px;
            text-align: left;

            background-color: #fffdf7;

            background-image:
                linear-gradient(
                    to right,
                    transparent 0,
                    transparent 50px,
                    rgba(180, 110, 110, 0.35) 50px,
                    rgba(180, 110, 110, 0.35) 51px,
                    transparent 51px
                ),
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 31px,
                    rgba(90, 130, 160, 0.22) 31px,
                    rgba(90, 130, 160, 0.22) 32px
                );

            box-shadow: 5px 6px 0 rgba(61, 53, 66, 0.15);
        }

        .mypage-paper::before {
            content: "";
            position: absolute;
            left: 18px;
            top: 0;
            bottom: 0;
            width: 4px;

            background:
                radial-gradient(
                    circle,
                    #c9c0b7 2px,
                    transparent 3px
                );

            background-size: 4px 24px;
            opacity: 0.65;
        }

        .mypage-label {
            display: inline-block;
            margin-bottom: 12px;
            padding: 4px 10px;

            background: #3d3542;
            color: #fffaf3;

            font-size: 11px;
            letter-spacing: 2px;
        }

        .mypage-paper h2 {
            margin: 0 0 30px;
            font-size: 25px;
        }

        /* 프로필 */

.profile-area {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 35px;
}

.profile-card {
    padding: 25px 20px;

    border: 1px solid rgba(61, 53, 66, 0.3);
    background: rgba(255, 255, 255, 0.35);

    display: flex;
    align-items: center;
    gap: 20px;
}

.profile-card .profile-info {
    flex: 1;
}


        .profile-info .small-text {
            margin: 0 0 5px;
            color: #888;
            font-size: 12px;
        }

        .profile-name {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }

        .nickname-area {
            display: none;
            margin-top: 15px;
        }

        .nickname-area.show {
            display: flex;
            gap: 8px;
        }

        .nickname-area input {
            flex: 1;
            min-width: 0;
            padding: 10px;

            border: 1px solid #999;
            border-radius: 0;

            background: #fff;
            color: #3d3542;

            font-family: monospace;
            font-size: 14px;
        }

        .nickname-area button {
            padding: 10px 15px;

            border: 2px solid #3d3542;
            background: #3d3542;
            color: #fffaf3;

            font-family: monospace;
            cursor: pointer;
        }

        .nickname-area button:hover {
            background: #fffaf3;
            color: #3d3542;
        }

        .change-nickname-button {
            margin-top: 10px;
            padding: 5px 10px;

            border: 1px dashed #888;
            background: transparent;
            color: #777;

            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
        }

        .change-nickname-button:hover {
            color: #3d3542;
            border-color: #3d3542;
        }

        /* 통계 */

        .stats-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat-box {
            padding: 20px;
            text-align: center;

            border: 1px solid rgba(61, 53, 66, 0.35);

            background: rgba(255, 255, 255, 0.5);
        }

        .stat-box .stat-number {
            display: block;
            margin-bottom: 5px;

            font-size: 27px;
            font-weight: bold;
        }

        .stat-box .stat-label {
            color: #777;
            font-size: 12px;
        }

        /* 일기 목록 */

        .my-diary-title {
            margin: 0 0 15px;
            padding-bottom: 10px;

            border-bottom: 2px solid #3d3542;

            font-size: 18px;
        }

        .my-diary-list {
            margin-bottom: 10px;
        }

        .my-diary-item {
            padding: 15px 5px;

            border-bottom: 1px dashed #bbb;
        }

        .my-diary-item:last-child {
            border-bottom: none;
        }

        .my-diary-item a {
            color: #3d3542;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .my-diary-item a:hover {
            text-decoration: underline;
        }

        .my-diary-date {
            margin: 5px 0 0;
            color: #888;
            font-size: 12px;
        }

        .empty-message {
            padding: 30px 10px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }

        
/* ==================================================
   MY PAGE - 두 사람의 일기
================================================== */

.diary-profiles {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.diary-profile-column {
    min-width: 0;
}

.diary-profile-column .my-diary-title {
    font-size: 16px;
}

        @media (max-width: 600px) {

            .mypage-paper {
                padding: 35px 25px 30px 55px;
            }

            .profile-area {
                gap: 15px;
            }

            .profile-icon {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .profile-name {
                font-size: 18px;
            }

            .stats-area {
                grid-template-columns: 1fr;
            }


        }
    </style>
</head>

<body>

<header class="site-header">

    <h1>OUR LITTLE DIARY</h1>

    <p class="site-subtitle">
        상관단나 기록 저장소
    </p>

    <div class="site-nav-area">
        <nav>
            <a href="index.html">HOME</a>
            <a href="diary.html">DIARY</a>
            <a href="write.html">WRITE</a>
            <a href="calendar.html">CALENDAR</a>
            <a href="dday.html">D-DAY</a>
            <a href="mypage.html">MY PAGE</a>
            <a href="trash.html">🗑️ TRASH</a>
        </nav>
    </div>

    <a href="search.html" class="site-search">🔍 SEARCH</a>

</header>

<div class="container mypage-container">


    

    <section class="mypage-paper">

        <div class="mypage-label">MY RECORD</div>

        <h2>나의 기록</h2>

        <!-- 프로필 -->


<div class="profile-area">

    <!-- 내 프로필 -->

    <div class="profile-card">

        <div class="profile-icon">
            ♡
        </div>

        <div class="profile-info">

            <p class="small-text">
                현재 로그인한 사용자
            </p>

            <p
                id="profile-name"
                class="profile-name">
                불러오는 중...
            </p>

            <button
                id="change-nickname-button"
                class="change-nickname-button">
                닉네임 변경
            </button>

            <div
                id="nickname-area"
                class="nickname-area">

                <input
                    type="text"
                    id="nickname-input"
                    placeholder="새 닉네임">

                <button id="save-nickname-button">
                    저장
                </button>

            </div>

        </div>

    </div>


    <!-- 친구 프로필 -->

    <div class="profile-card">

        <div class="profile-icon">
            ♡
        </div>

        <div class="profile-info">

            <p class="small-text">
                나의 친구
            </p>

            <p
    id="friend-profile-name"
    class="profile-name">
    불러오는 중...
</p>

        </div>

    </div>

</div>


        <!-- 통계 -->

        <div class="stats-area">

            <div class="stat-box">
                <span
                    id="diary-count"
                    class="stat-number">
                    0
                </span>

                <span class="stat-label">
                    내가 쓴 일기
                </span>
            </div>

            <div class="stat-box">
                <span
                    id="comment-count"
                    class="stat-number">
                    0
                </span>

                <span class="stat-label">
                    내가 쓴 댓글
                </span>
            </div>

        </div>


        <!-- 내 일기 -->

        
<!-- 두 사람의 일기 -->

<div class="diary-profiles">

    <!-- 내 일기 -->

    <div class="diary-profile-column">

        <h3 class="my-diary-title">
            내가 쓴 일기
        </h3>

        <div
            id="my-diary-list"
            class="my-diary-list">

            <div class="empty-message">
                일기를 불러오는 중...
            </div>

        </div>

    </div>


    <!-- 친구 일기 -->

    <div class="diary-profile-column">

        <h3 class="my-diary-title">
            친구가 쓴 일기
        </h3>

        <div
            id="friend-diary-list"
            class="my-diary-list">

            <div class="empty-message">
                일기를 불러오는 중...
            </div>

        </div>

    </div>

</div>



<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";


/* ==================================================
   FIREBASE
================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCaWKzu47seidxH0uc7avUjKpM2v-TvHa0",
    authDomain: "sangdan-diary.firebaseapp.com",
    projectId: "sangdan-diary",
    storageBucket: "sangdan-diary.firebasestorage.app",
    messagingSenderId: "224578307985",
    appId: "1:224578307985:web:18a0728ff83f9cfcc2bc30"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

// 친구 계정 UID
const FRIEND_UID =
    "HUoVSrtgBUUMrCJ6DLT06sHeOlx1";



/* ==================================================
   ELEMENTS
================================================== */

const profileName =
    document.getElementById("profile-name");
    
const friendProfileName =
    document.getElementById("friend-profile-name");

const nicknameInput =
    document.getElementById("nickname-input");

const nicknameArea =
    document.getElementById("nickname-area");

const changeNicknameButton =
    document.getElementById("change-nickname-button");

const saveNicknameButton =
    document.getElementById("save-nickname-button");

const diaryCount =
    document.getElementById("diary-count");

const commentCount =
    document.getElementById("comment-count");

const myDiaryList =
    document.getElementById("my-diary-list");

const friendDiaryList =
    document.getElementById("friend-diary-list");


/* ==================================================
   LOGIN
================================================== */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        alert("로그인이 필요합니다.");

        location.href = "login.html";

        return;
    }

    await loadMyPage(user);

});


/* ==================================================
   MY PAGE LOAD
================================================== */

async function loadMyPage(user) {

    try {

        /* ------------------------------
           사용자 정보
        ------------------------------ */

        const userDoc =
            await getDoc(
                doc(db, "users", user.uid)
            );

        let nickname = "";

        if (userDoc.exists()) {

            nickname =
                userDoc.data().nickname || "";

        }

        if (!nickname) {

            nickname =
                user.displayName ||
                user.email ||
                "사용자";

        }

        profileName.textContent = nickname;

        nicknameInput.value = nickname;


/* ------------------------------
   친구 정보
------------------------------ */

const friendDoc =
    await getDoc(
        doc(db, "users", FRIEND_UID)
    );

let friendNickname = "친구";

if (friendDoc.exists()) {

    friendNickname =
        friendDoc.data().nickname || "친구";

}

friendProfileName.textContent =
    friendNickname;



       
/* ------------------------------
   일기 불러오기
------------------------------ */

const diarySnapshot =
    await getDocs(
        collection(db, "diaries")
    );

const myDiaries = [];
const friendDiaries = [];

diarySnapshot.forEach((diaryDoc) => {

    const data = diaryDoc.data();

    /* 내 일기 */

    if (data.authorUid === user.uid) {

        myDiaries.push({
            id: diaryDoc.id,
            ...data
        });

    }


    /* 친구 일기 */

    if (data.authorUid === FRIEND_UID) {

        friendDiaries.push({
            id: diaryDoc.id,
            ...data
        });

    }

});



/* 최신 날짜순 */

myDiaries.sort((a, b) => {

    return String(b.date)
        .localeCompare(String(a.date));

});

friendDiaries.sort((a, b) => {

    return String(b.date)
        .localeCompare(String(a.date));

});


diaryCount.textContent =
    myDiaries.length;

      
/* ------------------------------
   일기 목록
------------------------------ */


/* ==============================
   내 일기
============================== */

myDiaryList.innerHTML = "";


if (myDiaries.length === 0) {

    myDiaryList.innerHTML = `
        <div class="empty-message">
            아직 작성한 일기가 없습니다.
        </div>
    `;

} else {

    myDiaries.forEach((diary) => {

        const item =
            document.createElement("div");

        item.className =
            "my-diary-item";

        item.innerHTML = `
            <a href="diary.html">
                ${escapeHTML(
                    diary.title || "제목 없음"
                )}
            </a>

            <p class="my-diary-date">
                ${escapeHTML(
                    diary.date || ""
                )}
            </p>
        `;

        myDiaryList.appendChild(item);

    });

}


/* ==============================
   친구 일기
============================== */

friendDiaryList.innerHTML = "";


if (friendDiaries.length === 0) {

    friendDiaryList.innerHTML = `
        <div class="empty-message">
            아직 작성한 일기가 없습니다.
        </div>
    `;

} else {

    friendDiaries.forEach((diary) => {

        const item =
            document.createElement("div");

        item.className =
            "my-diary-item";

        item.innerHTML = `
            <a href="diary.html">
                ${escapeHTML(
                    diary.title || "제목 없음"
                )}
            </a>

            <p class="my-diary-date">
                ${escapeHTML(
                    diary.date || ""
                )}
            </p>
        `;

        friendDiaryList.appendChild(item);

    });

}



        /* ------------------------------
           댓글 개수
        ------------------------------ */

        let myCommentCount = 0;


        for (const diary of diarySnapshot.docs) {

            const diaryData = diary.data();

            const comments =
                diaryData.comments || [];


            comments.forEach((comment) => {

                if (
                    comment.uid === user.uid ||
                    comment.authorUid === user.uid
                ) {

                    myCommentCount++;

                }

            });

        }


        commentCount.textContent =
            myCommentCount;


    } catch (error) {

        console.error(error);

        alert(
            "마이페이지를 불러오는 중 오류가 발생했습니다.\n\n" +
            error.message
        );

    }

}


/* ==================================================
   NICKNAME
================================================== */

changeNicknameButton.addEventListener(
    "click",
    () => {

        nicknameArea.classList.toggle("show");

        if (
            nicknameArea.classList.contains("show")
        ) {

            nicknameInput.focus();

        }

    }
);


saveNicknameButton.addEventListener(
    "click",
    async () => {

        const user = auth.currentUser;

        if (!user) {

            alert("로그인이 필요합니다.");

            return;
        }


        const newNickname =
            nicknameInput.value.trim();


        if (!newNickname) {

            alert("닉네임을 입력해주세요.");

            return;
        }


        try {

            saveNicknameButton.disabled = true;

            await setDoc(
                doc(db, "users", user.uid),
                {
                    nickname: newNickname
                },
                {
                    merge: true
                }
            );


            profileName.textContent =
                newNickname;

            nicknameArea.classList.remove("show");

            alert("닉네임이 변경되었습니다!");


        } catch (error) {

            console.error(error);

            alert(
                "닉네임 변경 중 오류가 발생했습니다.\n\n" +
                error.message
            );

        } finally {

            saveNicknameButton.disabled = false;

        }

    }
);


/* ==================================================
   HTML 안전 처리
================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==================================================
   추후 기능
================================================== */

document
    .getElementById("draft-button")
    .addEventListener("click", () => {

        alert("임시저장 기능은 다음 단계에서 연결할 예정이에요!");

    });


document
    .getElementById("trash-button")
    .addEventListener("click", () => {

        alert("휴지통 기능은 다음 단계에서 연결할 예정이에요!");

    });

</script>

</body>
</html>
