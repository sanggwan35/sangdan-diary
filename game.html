/* =================================
   NEON RETRO CRT
================================= */

.game-card {
    position: relative;
    isolation: isolate;
    overflow: hidden;

    min-height: 225px;
    padding: 36px 30px;

    background: #d9cbb5;
    border: 1px solid #b9a68a;
    border-radius: 19px;

    box-shadow:
        0 4px 0 #a18d72,
        0 8px 20px rgba(39, 31, 25, 0.10);

    transition: transform 0.2s ease,
                box-shadow 0.2s ease;
}

/* CRT 유리 화면 */
.game-card::before {
    content: "";
    position: absolute;
    inset: 10px;
    z-index: -1;

    border: 2px solid #4b4651;
    border-radius: 13px;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,0.025) 4px
        ),
        radial-gradient(
            ellipse at 50% 35%,
            #34313e 0%,
            #211f2a 65%,
            #17161f 100%
        );

    box-shadow:
        inset 0 0 25px rgba(0,0,0,0.55),
        0 0 10px rgba(170, 145, 255, 0.10);
}

/* 은은한 전원 LED */
.game-card::after {
    content: "";
    position: absolute;

    width: 6px;
    height: 6px;

    right: 23px;
    bottom: 6px;

    z-index: 3;
    pointer-events: none;

    border-radius: 50%;
    background: #baff70;

    box-shadow:
        0 0 5px #baff70,
        0 0 10px rgba(186,255,112,0.5);
}

/* 카드 내부 요소 */
.game-card > * {
    position: relative;
    z-index: 1;
}

/* 게임 제목 */
.game-card-title {
    margin-top: 0;

    color: #c8ffcf;
    font-family: monospace;
    font-size: 21px;
    letter-spacing: 0.5px;

    text-shadow:
        0 0 5px rgba(157,255,177,0.55),
        0 0 13px rgba(157,255,177,0.18);
}

/* 게임 설명 */
.game-card-description {
    color: #c2bacd;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.8;
}

/* 게임 시작 버튼 */
.game-open-button {
    display: inline-block;
    margin-top: 13px;
    padding: 9px 17px;

    background: #caff80;
    color: #292b2c;

    border: 1px solid #e0ffb5;
    border-radius: 5px;

    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;

    box-shadow:
        0 0 7px rgba(202,255,128,0.25);

    transition: all 0.2s ease;
}

.game-open-button:hover {
    background: #e0ffb5;

    box-shadow:
        0 0 8px rgba(202,255,128,0.65),
        0 0 18px rgba(202,255,128,0.25);

    transform: translateY(-2px);
}

/* 마우스 올렸을 때 */
.game-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 5px 0 #a18d72,
        0 10px 24px rgba(39,31,25,0.13);
}

/* =================================
   RETRO TV ANTENNA
================================= */

.game-card {
    overflow: visible;
    margin-top: 32px;
}

.tv-antenna {
    position: absolute;
    top: -35px;
    left: 50%;

    width: 76px;
    height: 38px;

    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
}

.tv-antenna span {
    position: absolute;
    bottom: 0;
    left: 50%;

    width: 3px;
    height: 37px;

    border-radius: 5px;

    background: linear-gradient(
        to right,
        #98866e,
        #f0dfc2,
        #98866e
    );

    transform-origin: bottom center;

    box-shadow: 0 0 3px rgba(255,255,255,0.2);
}

/* 왼쪽 안테나 */
.tv-antenna span:first-child {
    transform: rotate(-38deg);
}

/* 오른쪽 안테나 */
.tv-antenna span:last-child {
    transform: rotate(38deg);
}

/* 안테나 끝의 작은 LED */
.tv-antenna span::after {
    content: "";

    position: absolute;
    top: -4px;
    left: 50%;

    width: 7px;
    height: 7px;

    transform: translateX(-50%);
    border-radius: 50%;

    background: #caff80;

    box-shadow:
        0 0 5px #caff80,
        0 0 10px rgba(202,255,128,0.5);
}


.trpg-section {

/* =================================
   TRPG GAME FILE
================================= */

.trpg-card {

/* =================================
   FILE HEADER
================================= */

.trpg-card-header {
    display: flex;
    align-items: center;

    height: 38px;

    padding: 0 14px;

    box-sizing: border-box;

    border-bottom: 1px solid #625044;

    background: #625044;

    color: #fffaf3;

    font-family:
        "Pretendard",
        "Noto Sans KR",

}

.trpg-card-header-icon {
    margin-right: 8px;

    font-size: 13px;
}


/* =================================
   COVER
================================= */

.trpg-card-cover {
    width: 100%;

    aspect-ratio: 16 / 7;

    margin: 0;

    overflow: hidden;

    border-bottom: 1px solid rgba(98, 80, 68, 0.35);

    background: #e7dfd2;
}

.trpg-card-cover img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =================================
   GAME INFO
================================= */

.trpg-card-info {
    padding: 16px 18px 12px;

    box-sizing: border-box;

    background: #f8f3e9;
}

.trpg-card-title {
    display: flex;
    align-items: center;

    margin: 0;

    padding: 0;

    font-family:
        "Pretendard",

        Arial,

    font-size: 15px;
    font-weight: 600;

    line-height: 1.4;
}

}

.trpg-card-file {

    padding: 0 0 0 21px;

        "Pretendard",
        "Noto Sans KR",

        sans-serif;

    letter-spacing: 0.7px;
}

}


/* =================================
   FOOTER
================================= */

.trpg-card-footer {
    display: flex;

    align-items: center;

    padding: 0 18px 16px;

}


/* =================================
   PLAY BUTTON
================================= */

.trpg-play-button {
    display: flex;

    justify-content: center;
    align-items: center;

    height: 32px;

}

    background: #625044;

}

    }

}

<script>

    /* =================================
       GAME TAB
    ================================= */

    const gameTabButton =
        document.getElementById("game-tab-button");

    const trpgTabButton =
        document.getElementById("trpg-tab-button");

    const visualNovelSection =
        document.getElementById("visual-novel-section");

    const trpgSection =
        document.getElementById("trpg-section");

    const trpgList =
        document.getElementById("trpg-list");


    gameTabButton.addEventListener(
        "click",
        () => {

            gameTabButton.classList.add("active");
            trpgTabButton.classList.remove("active");

            visualNovelSection.style.display = "grid";
            trpgSection.style.display = "none";

        }
    );


    trpgTabButton.addEventListener(
        "click",
        () => {

            trpgTabButton.classList.add("active");
            gameTabButton.classList.remove("active");

            visualNovelSection.style.display = "none";
            trpgSection.style.display = "block";

            loadTrpgGames();

        }
    );


    /* =================================
       GitHub TRPG 게임 불러오기
    ================================= */

    async function loadTrpgGames() {

        trpgList.innerHTML = `
            <div class="trpg-empty">
                TRPG 게임을 불러오는 중...
            </div>
        `;


        try {

            const response =
                await fetch(
                    "https://api.github.com/repos/sanggwan35/sangdan-diary/contents/games/trpg?ref=main"
                );


            if (!response.ok) {

                throw new Error(
                    "GitHub 게임 목록을 불러오지 못했습니다."
                );

            }


            const files =
                await response.json();


            const gameFolders =
                files.filter(
                    item =>
                        item.type === "dir"
                );


            if (gameFolders.length === 0) {

                trpgList.innerHTML = `
                    <div class="trpg-empty">
                        아직 등록된 TRPG 게임이 없습니다.
                    </div>
                `;

                return;

            }


            trpgList.innerHTML = "";


            for (
                const folder of gameFolders
            ) {

                const folderName =
                    folder.name;

let quote = [];

try {
    const infoResponse = await fetch(
        `https://api.github.com/repos/sanggwan35/sangdan-diary/contents/games/trpg/${encodeURIComponent(folderName)}/info.json?ref=main`
    );

    if (infoResponse.ok) {
        const infoFile = await infoResponse.json();

        const infoText = decodeURIComponent(
            escape(
                atob(infoFile.content.replace(/\n/g, ""))
            )
        );

        const info = JSON.parse(infoText);

        quote = Array.isArray(info.quote)
    ? info.quote
    : [info.quote || ""];
    }
} catch (error) {
    console.log(
        "게임 설명을 불러오지 못했습니다:",
        folderName,
        error
    );
}


                const gameUrl =
                    `games/trpg/${encodeURIComponent(folderName)}/index.html`;


                const card =
                    document.createElement("div");


                card.className =
                    "trpg-card";


card.innerHTML = `

    <div class="trpg-card-header">
        <span class="trpg-card-header-icon">▣</span>
        <span>TRPG BACKUP</span>
    </div>

    <div class="trpg-card-cover">
        <img
            src="games/trpg/${encodeURIComponent(folderName)}/cover.jpg"
            alt="${escapeHtml(folderName)} 표지"
            onerror="this.parentElement.style.display='none';"
        >
    </div>

    <div class="trpg-card-info">

        <div class="trpg-card-title">
            <span class="trpg-file-icon">📄</span>
            ${escapeHtml(folderName)}
        </div>

<div class="trpg-card-file">
    ${(quote.length ? quote : ["TRPG SCRIPT"])
        .map(line => escapeHtml(line))
        .join("<br>")}
</div>

    </div>

    <div class="trpg-card-footer">

        <button
            type="button"
            class="game-open-button trpg-play-button"
        >
            PLAY ▶
        </button>

    </div>

`;
            


                const playButton =
                    card.querySelector(
                        ".trpg-play-button"
                    );


                playButton.addEventListener(
                    "click",
                    () => {

                        window.open(
                            new URL(
                                gameUrl,
                                window.location.href

                    }
                );


                trpgList.appendChild(card);

            }


        } catch (error) {

            console.error(
                "TRPG 게임 목록 불러오기 오류:",
                error
            );


            trpgList.innerHTML = `
                <div class="trpg-empty">
                    TRPG 게임 목록을 불러오지 못했습니다.
                </div>
            `;

        }

    }


    /* =================================
       HTML 문자 처리
    ================================= */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


</script>
