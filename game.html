<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>GAME ARCHIVE</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .game-archive-container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .game-archive-paper {
            padding: 35px;
            background: #fffaf3;
            border: 2px solid #625044;
            box-sizing: border-box;
        }

        .game-archive-label {
            display: inline-block;
            margin-bottom: 10px;
            padding: 5px 10px;
            background: #625044;
            color: #fffaf3;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .game-archive-paper h2 {
            margin-top: 5px;
            margin-bottom: 30px;
            font-size: 26px;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .game-card {
            padding: 25px;
            border: 1px solid rgba(98, 80, 68, 0.3);
            background: #f7f2e0;
            box-sizing: border-box;
        }

        .game-card-title {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .game-card-description {
            margin: 0 0 20px;
            line-height: 1.7;
        }

        .game-open-button {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid #625044;
            background: #fffaf3;
            color: #3d3542;
            text-decoration: none;
            cursor: pointer;
        }

        .game-open-button:hover {
            background: #625044;
            color: #fffaf3;
        }

        @media (max-width: 768px) {
            .game-archive-container {
                width: 100%;
                box-sizing: border-box;
                padding: 0 20px;
            }

            .game-archive-paper {
                padding: 25px 20px;
            }

            .game-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="site-header">

    <h1>SANGWAN-DANNA PRISON</h1>

    <p class="site-subtitle">
        상관단나 기록 저장소
    </p>

    <div class="site-nav-area">
        <nav>
            <a href="index.html">HOME</a>
            <a href="diary.html">DIARY</a>
            <a href="write.html">WRITE</a>
            <a href="calendar.html">CALENDAR</a>
            <a href="dday.html">D-DAY</a>
            <a href="movie.html">MOVIE</a>
            <a href="game.html">GAME</a>
            <a href="mypage.html">MY PAGE</a>
        </nav>
    </div>

    <a href="trash.html">🗑️ TRASH</a>
    <a href="search.html" class="site-search">🔍 SEARCH</a>

</header>


<div class="container game-archive-container">

    <section class="game-archive-paper">

        <div class="game-archive-label">
            GAME ARCHIVE
        </div>

        <h2>🎮 게임 보관함</h2>

        <div class="game-list">

            <div class="game-card">

                <h3 class="game-card-title">
                    미연시 게임
                </h3>

                <p class="game-card-description">
                    내가 만든 미연시 게임을 보관하는 곳
                </p>

                <a
                    href="#"
                    class="game-open-button"
                >
                    ▶ 게임 시작
                </a>

            </div>

        </div>

    </section>

</div>

</body>
</html>
