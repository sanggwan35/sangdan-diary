<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>LOGIN - 우리들의 교환일기</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>SANGWAN-DANNA PRISON</h1>

        <h2>LOGIN</h2>

        <div class="login-form">

            <label>이메일</label>
            <input type="email" id="email" placeholder="이메일을 입력하세요">

            <label>비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요">

            <button id="login-button">LOGIN</button>

            <p id="login-message"></p>

        </div>

    </div>

<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "AIzaSyCaWKzu47seidxH0uc7avUjKpM2v-TvHa0",

        authDomain: "sangdan-diary.firebaseapp.com",

        projectId: "sangdan-diary",

        storageBucket: "sangdan-diary.firebasestorage.app",

        messagingSenderId: "224578307985",

        appId: "1:224578307985:web:18a0728ff83f9cfcc2bc30"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const loginButton =
        document.getElementById("login-button");


    loginButton.addEventListener("click", async () => {

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("login-message");


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            message.textContent =
                "로그인 성공!";


            window.location.href =
                "index.html";


        } catch (error) {

            console.error(error);

            message.textContent =
                "이메일 또는 비밀번호가 올바르지 않습니다.";

        }

    });

</script>

</body>
</html>
