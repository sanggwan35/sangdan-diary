const today = new Date();


async function loadMainDDay() {

    const box =
        document.getElementById("home-dday-list");

    box.innerHTML = "";

    const snapshot =
        await getDocs(
            collection(db, "ddays")
        );

    const ddays = [];

    snapshot.forEach((ddayDoc) => {

        const data = ddayDoc.data();

        ddays.push(data);

    });

    /*
       대표 D-DAY를 가장 먼저 표시하고
       나머지는 날짜순으로 표시
    */
    ddays.sort((a, b) => {

        if (a.isMain === true && b.isMain !== true) {
            return -1;
        }

        if (a.isMain !== true && b.isMain === true) {
            return 1;
        }

        return String(a.date || "")
            .localeCompare(
                String(b.date || "")
            );

    });

    const selected =
        ddays.slice(0, 3);

    if (selected.length === 0) {

        box.innerHTML = `
            <div class="home-dday-item">
                <span>등록된 D-DAY가 없습니다.</span>
            </div>
        `;

        return;
    }

    selected.forEach((dday) => {

        const item =
            document.createElement("div");

        item.className =
            "home-dday-item";

        const ddayNumber =
            calculateDDay(dday.date);

        item.innerHTML = `
            <div class="home-dday-title">
                ${dday.title || "제목 없음"}
            </div>

            <div class="home-dday-number">
                ${ddayNumber}
            </div>

            <div class="home-dday-date">
                ${dday.date || ""}
            </div>
        `;

        box.appendChild(item);

    });

}


function calculateDDay(dateString) {

    const today = new Date();

    today.setHours(0, 0, 0, 0);

    const target =
        new Date(dateString);

    target.setHours(0, 0, 0, 0);

    const difference =
        target - today;

    const days =
        Math.round(
            difference /
            (1000 * 60 * 60 * 24)
        );

    if (days > 0) {
        return "D-" + days;
    }

    if (days === 0) {
        return "D-DAY";
    }

    return "D+" + Math.abs(days);
}

async function loadMiniCalendar() {

    const year =
        miniCalendarDate.getFullYear();

    const month =
        miniCalendarDate.getMonth();

    const monthText =
        document.getElementById(
            "mini-calendar-month"
        );

    const daysBox =
        document.getElementById(
            "mini-calendar-days"
        );

    monthText.textContent =
        `${year}. ${String(month + 1).padStart(2, "0")}`;

    daysBox.innerHTML = "";

    let diaryDates = [];

    try {

        const snapshot =
            await getDocs(
                collection(db, "diaries")
            );

        snapshot.forEach((diaryDoc) => {

            const data =
                diaryDoc.data();

            if (data.date) {
                diaryDates.push(data.date);
            }

        });

    } catch (error) {

        console.error(
            "미니 달력 일기 불러오기 오류:",
            error
        );

    }


    const firstDay =
        new Date(year, month, 1)
            .getDay();

    const lastDate =
        new Date(year, month + 1, 0)
            .getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "mini-calendar-day empty";

        daysBox.appendChild(empty);

    }


    const today =
        new Date();


    for (
        let day = 1;
        day <= lastDate;
        day++
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "mini-calendar-day";

        cell.textContent =
            day;


        const dateString =
            `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;


        if (
            diaryDates.includes(
                dateString
            )
        ) {

            cell.classList.add(
                "has-diary"
            );

        }


        if (
            today.getFullYear() === year &&
            today.getMonth() === month &&
            today.getDate() === day
        ) {

            cell.classList.add(
                "today"
            );

        }


        daysBox.appendChild(cell);

    }

}

async function loadRecentMovies() {

            await getDocs(

            movies.push({
                id: movieDoc.id,
                ...movieDoc.data()
            });

        movies.sort((a, b) =>
            String(
                b.watchedDate || ""
            ).localeCompare(
                String(
                    a.watchedDate || ""
                )
            )
        );


        const movie =
            movies[0];


        if (!movie) {

            box.innerHTML = `
                <div class="home-movie-empty">
                    아직 같이 본 영화가 없어요.

            `;

        box.innerHTML = `

                <p class="home-movie-date">

        `;

    } catch (error) {

        console.error(
            "최근 영화 불러오기 오류:",

        box.innerHTML = `
            <div class="home-movie-empty">
                영화를 불러오지 못했어요.
            </div>
        `;

    }

}

const adviceText =
    document.getElementById("advice-text");

const adviceButton =
    document.getElementById("advice-button");

adviceButton.addEventListener(
    "click",
    () => {

        const randomIndex =
            Math.floor(
                Math.random() * adviceList.length
            );

        adviceText.textContent =
            adviceList[randomIndex];

    }
);


document.addEventListener("click", () => {
    window.parent.postMessage("site-click", "*");
}, { once: true });


</script>
