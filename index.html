async function loadMainDDay() {

    const box = document.getElementById("main-dday");

    const snapshot = await getDocs(
        collection(db, "ddays")
    );

    let mainDDay = null;

    snapshot.forEach((ddayDoc) => {

        const data = ddayDoc.data();

        if (data.isMain === true) {
            mainDDay = data;
        }

    });


    if (!mainDDay) {

        box.innerHTML =
            "<p>대표 D-DAY가 없습니다.</p>";

        return;
    }


    const ddayNumber =
        calculateDDay(mainDDay.date);


    box.innerHTML = `
        <h3>${mainDDay.title}</h3>
        <p>${ddayNumber}</p>
        <p>${mainDDay.date}</p>
    `;

}


async function loadRecentDiaries() {

    const box =
        document.getElementById("recent-diary-list");

    const snapshot =
        await getDocs(
            collection(db, "diaries")
        );


    const diaries = [];


    snapshot.forEach((diaryDoc) => {

        diaries.push({
            id: diaryDoc.id,
            ...diaryDoc.data()
        });

    });


    diaries.sort((a, b) =>
        String(b.date).localeCompare(
            String(a.date)
        )
    );


    const recent =
        diaries.slice(0, 3);


    box.innerHTML = "";


    if (recent.length === 0) {

        box.innerHTML =
            "<p>아직 작성된 일기가 없습니다.</p>";

        return;
    }


    recent.forEach((diary) => {

        const item =
            document.createElement("div");

        item.className = "diary-item";


        const author =
            diary.authorName ||
            diary.author ||
            "이름 없음";


        item.innerHTML = `
            <a href="diary.html">
                <strong>${diary.title}</strong>
            </a>

            <p>${diary.date} · ${author}</p>
        `;


        box.appendChild(item);

    });

}


function calculateDDay(dateString) {

    const today = new Date();

    today.setHours(0, 0, 0, 0);


    const target =
        new Date(dateString);

    target.setHours(0, 0, 0, 0);


    const difference =
        target - today;


    const days =
        Math.round(
            difference /
            (1000 * 60 * 60 * 24)
        );


    if (days > 0) {
        return "D-" + days;
    }

    if (days === 0) {
        return "D-DAY";
    }

    return "D+" + Math.abs(days);

}
